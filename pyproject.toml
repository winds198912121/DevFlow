[project]
name = "harness"
version = "0.1.0"
description = "DevFlow harness — AI coding platform control plane"
requires-python = ">=3.12.10,<3.13"
dependencies = [
    "typer>=0.27.2,<0.28",
]

[project.scripts]
harness = "harness.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness"]

[dependency-groups]
dev = [
    "pytest>=8.0,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
