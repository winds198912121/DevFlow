<text x="480" y="335" fill="#5c5752" font-size="9" font-family="'Commit Mono', ui-monospace, 'SF Mono', Menlo, 'PingFang SC', 'Hiragino Sans GB', monospace" text-anchor="middle">AD-15 前置</text>
<rect x="360" y="448" width="240" height="56" rx="6" fill="#f3f2f0"/>
