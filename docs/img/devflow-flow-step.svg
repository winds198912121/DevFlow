<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-step-title flow-step-desc"
     viewBox="0 0 980 1024" width="100%" style="max-width:980px">
  <title id="flow-step-title">单个步骤的生命周期</title>
  <desc id="flow-step-desc">launch_step 的判定顺序：先看跨调用幂等标记，再看前置步骤是否封存，然后分派适配器、封存工件、写标记，最后由 step_status 解析终态。三个判定各有自己的中止出口，标在右侧。</desc>
  <defs>
  <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#5c5752"/>
  </marker>
  <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#b86b52"/>
  </marker>
  <marker id="arrow-soft" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#8b847d"/>
  </marker>
</defs>
  <rect width="100%" height="100%" fill="#f3f2f0"/>
<rect x="330.0" y="16" width="300" height="48" rx="24.0" fill="#f3f2f0"/>
<rect x="330.0" y="16" width="300" height="48" rx="24.0" fill="#ebe7e4" stroke="#5c5752" stroke-width="1"/>
<text x="480" y="44.0" fill="#252f3d" font-size="12" font-weight="600" font-family="'Commit Mono', ui-monospace, 'SF Mono', Menlo, 'PingFang SC', 'Hiragino Sans GB', monospace" text-anchor="middle">launch_step(step)</text>
<polygon points="480,88 670,148 480,208 290,148" fill="#f3f2f0"/>
<polygon points="480,88 670,148 480,208 290,148" fill="#ffffff" stroke="#252f3d" stroke-width="1"/>
<text x="480" y="146" fill="#252f3d" font-size="12" font-weight="600" font-family="'Commit Mono', ui-monospace, 'SF Mono', Menlo, 'PingFang SC', 'Hiragino Sans GB', monospace" text-anchor="middle">跨调用幂等？</text>
<text x="480" y="163" fill="#5c5752" font-size="9" font-family="'Commit Mono', ui-monospace, 'SF Mono', Menlo, 'PingFang SC', 'Hiragino Sans GB', monospace" text-anchor="middle">.locked 已存在</text>
<polygon points="480,260 670,320 480,380 290,320" fill="#f3f2f0"/>
<polygon points="480,260 670,320 480,380 290,320" fill="#ffffff" stroke="#252f3d" stroke-width="1"/>
