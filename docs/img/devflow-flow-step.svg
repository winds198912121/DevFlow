<text x="480.0" y="754" fill="#252f3d" font-size="12" font-weight="600" font-family="'Commit Mono', ui-monospace, 'SF Mono', Menlo, 'PingFang SC', 'Hiragino Sans GB', monospace" text-anchor="middle">封存工件 + 写 .locked</text>
<text x="480.0" y="772" fill="#5c5752" font-size="9" font-weight="400" font-family="'Commit Mono', ui-monospace, 'SF Mono', Menlo, 'PingFang SC', 'Hiragino Sans GB', monospace" text-anchor="middle">put_pending → lock → marker</text>
<rect x="350" y="824" width="260" height="56" rx="6" fill="#f3f2f0"/>
<rect x="350" y="824" width="260" height="56" rx="6" fill="#ffffff" stroke="#252f3d" stroke-width="1"/>
<rect x="358" y="830" width="52" height="12" rx="2" fill="transparent" stroke="#252f3d" stroke-opacity="0.4" stroke-width="0.8"/>
<text x="384" y="839" fill="#252f3d" fill-opacity="0.85" font-size="7" font-family="'Commit Mono', ui-monospace, 'SF Mono', Menlo, 'PingFang SC', 'Hiragino Sans GB', monospace" text-anchor="middle" letter-spacing="0.08em">AD-24</text>
<text x="480.0" y="858" fill="#252f3d" font-size="12" font-weight="600" font-family="'Commit Mono', ui-monospace, 'SF Mono', Menlo, 'PingFang SC', 'Hiragino Sans GB', monospace" text-anchor="middle">step_status 解析终态</text>
<text x="480.0" y="876" fill="#5c5752" font-size="9" font-weight="400" font-family="'Commit Mono', ui-monospace, 'SF Mono', Menlo, 'PingFang SC', 'Hiragino Sans GB', monospace" text-anchor="middle">单一解析器</text>
