<text x="480.0" y="482" fill="#252f3d" font-size="12" font-weight="600" font-family="'Commit Mono', ui-monospace, 'SF Mono', Menlo, 'PingFang SC', 'Hiragino Sans GB', monospace" text-anchor="middle">适配器 dispatch</text>
<text x="480.0" y="500" fill="#5c5752" font-size="9" font-weight="400" font-family="'Commit Mono', ui-monospace, 'SF Mono', Menlo, 'PingFang SC', 'Hiragino Sans GB', monospace" text-anchor="middle">ADAPTER_REGISTRY[mode]</text>
<polygon points="480,532 670,592 480,652 290,592" fill="#f3f2f0"/>
<polygon points="480,532 670,592 480,652 290,592" fill="#ffffff" stroke="#252f3d" stroke-width="1"/>
<text x="480" y="596" fill="#252f3d" font-size="12" font-weight="600" font-family="'Commit Mono', ui-monospace, 'SF Mono', Menlo, 'PingFang SC', 'Hiragino Sans GB', monospace" text-anchor="middle">返回 succeeded？</text>
<rect x="350" y="720" width="260" height="56" rx="6" fill="#f3f2f0"/>
