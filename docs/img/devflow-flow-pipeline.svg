  <title id="flow-pipeline-title">DevFlow 六步流水线总览</title>
  <desc id="flow-pipeline-desc">从 project.yaml 到 delivery.json 的运行流程：六个固定顺序的步骤，每步由适配器执行后封存工件，再由门禁模式决定该步终态是 Locked 还是 Done。</desc>
