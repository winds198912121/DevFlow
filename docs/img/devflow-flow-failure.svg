<text x="720.0" y="241" fill="#5c5752" font-size="9" font-weight="400" font-family="'Commit Mono', ui-monospace, 'SF Mono', Menlo, 'PingFang SC', 'Hiragino Sans GB', monospace" text-anchor="middle">查 bench 推荐</text>
<rect x="560" y="280" width="320" height="56" rx="6" fill="#f3f2f0"/>
<rect x="560" y="280" width="320" height="56" rx="6" fill="#ffffff" stroke="#252f3d" stroke-width="1"/>
<text x="720.0" y="303" fill="#252f3d" font-size="12" font-weight="600" font-family="'Commit Mono', ui-monospace, 'SF Mono', Menlo, 'PingFang SC', 'Hiragino Sans GB', monospace" text-anchor="middle">rung 4 · 用 promoted skill</text>
<text x="720.0" y="321" fill="#5c5752" font-size="9" font-weight="400" font-family="'Commit Mono', ui-monospace, 'SF Mono', Menlo, 'PingFang SC', 'Hiragino Sans GB', monospace" text-anchor="middle">AD-6 skill 晋级</text>
<rect x="560" y="392" width="320" height="56" rx="6" fill="#f3f2f0"/>
<rect x="560" y="392" width="320" height="56" rx="6" fill="#ebe7e4" stroke="#5c5752" stroke-width="1" stroke-dasharray="4,3"/>
<rect x="568" y="398" width="44" height="12" rx="2" fill="transparent" stroke="#5c5752" stroke-opacity="0.4" stroke-width="0.8"/>
<text x="590" y="407" fill="#5c5752" fill-opacity="0.85" font-size="7" font-family="'Commit Mono', ui-monospace, 'SF Mono', Menlo, 'PingFang SC', 'Hiragino Sans GB', monospace" text-anchor="middle" letter-spacing="0.08em">HITL</text>
<text x="720.0" y="426" fill="#252f3d" font-size="12" font-weight="600" font-family="'Commit Mono', ui-monospace, 'SF Mono', Menlo, 'PingFang SC', 'Hiragino Sans GB', monospace" text-anchor="middle">rung 5 · 人工介入</text>
<text x="720.0" y="444" fill="#5c5752" font-size="9" font-weight="400" font-family="'Commit Mono', ui-monospace, 'SF Mono', Menlo, 'PingFang SC', 'Hiragino Sans GB', monospace" text-anchor="middle">暂停 · 不再自动</text>
