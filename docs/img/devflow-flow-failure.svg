<text x="372.0" y="234" fill="#252f3d" font-size="12" font-weight="600" font-family="'Commit Mono', ui-monospace, 'SF Mono', Menlo, 'PingFang SC', 'Hiragino Sans GB', monospace" text-anchor="middle">Error Store append</text>
<text x="372.0" y="252" fill="#5c5752" font-size="9" font-weight="400" font-family="'Commit Mono', ui-monospace, 'SF Mono', Menlo, 'PingFang SC', 'Hiragino Sans GB', monospace" text-anchor="middle">只增不改 · AD-4</text>
<rect x="560" y="40" width="320" height="56" rx="6" fill="#f3f2f0"/>
<rect x="560" y="40" width="320" height="56" rx="6" fill="#ffffff" stroke="#252f3d" stroke-width="1"/>
<text x="720.0" y="63" fill="#252f3d" font-size="12" font-weight="600" font-family="'Commit Mono', ui-monospace, 'SF Mono', Menlo, 'PingFang SC', 'Hiragino Sans GB', monospace" text-anchor="middle">rung 1 · 同 agent 同 LLM</text>
<text x="720.0" y="81" fill="#5c5752" font-size="9" font-weight="400" font-family="'Commit Mono', ui-monospace, 'SF Mono', Menlo, 'PingFang SC', 'Hiragino Sans GB', monospace" text-anchor="middle">重试同一执行者</text>
<rect x="560" y="120" width="320" height="56" rx="6" fill="#f3f2f0"/>
<rect x="560" y="120" width="320" height="56" rx="6" fill="#ffffff" stroke="#252f3d" stroke-width="1"/>
<text x="720.0" y="143" fill="#252f3d" font-size="12" font-weight="600" font-family="'Commit Mono', ui-monospace, 'SF Mono', Menlo, 'PingFang SC', 'Hiragino Sans GB', monospace" text-anchor="middle">rung 2 · 同 agent 换 LLM</text>
<text x="720.0" y="161" fill="#5c5752" font-size="9" font-weight="400" font-family="'Commit Mono', ui-monospace, 'SF Mono', Menlo, 'PingFang SC', 'Hiragino Sans GB', monospace" text-anchor="middle">换一个模型再试</text>
