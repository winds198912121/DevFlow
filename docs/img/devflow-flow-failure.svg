<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-failure-title flow-failure-desc"
     viewBox="0 0 960 520" width="100%" style="max-width:960px">
  <title id="flow-failure-title">失败路径与重试阶梯</title>
  <desc id="flow-failure-desc">步骤失败先append 一条只增不改的 Error Store 记录，然后逐级升档：rung 1 同执行者重试，rung 2 换 LLM，rung 3 换 agent，rung 4 用已晋级 skill，rung 5 交回人工并暂停。</desc>
  <defs>
  <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#5c5752"/>
  </marker>
  <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#b86b52"/>
  </marker>
  <marker id="arrow-soft" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#8b847d"/>
  </marker>
</defs>
  <rect width="100%" height="100%" fill="#f3f2f0"/>
<rect x="40" y="200" width="180" height="56" rx="6" fill="#f3f2f0"/>
<rect x="40" y="200" width="180" height="56" rx="6" fill="#ffffff" stroke="#252f3d" stroke-width="1"/>
<rect x="48" y="206" width="44" height="12" rx="2" fill="transparent" stroke="#252f3d" stroke-opacity="0.4" stroke-width="0.8"/>
<text x="70" y="215" fill="#252f3d" fill-opacity="0.85" font-size="7" font-family="'Commit Mono', ui-monospace, 'SF Mono', Menlo, 'PingFang SC', 'Hiragino Sans GB', monospace" text-anchor="middle" letter-spacing="0.08em">FAIL</text>
<text x="130.0" y="234" fill="#252f3d" font-size="12" font-weight="600" font-family="'Commit Mono', ui-monospace, 'SF Mono', Menlo, 'PingFang SC', 'Hiragino Sans GB', monospace" text-anchor="middle">步骤失败</text>
<text x="130.0" y="252" fill="#5c5752" font-size="9" font-weight="400" font-family="'Commit Mono', ui-monospace, 'SF Mono', Menlo, 'PingFang SC', 'Hiragino Sans GB', monospace" text-anchor="middle">adapter 返回 failed</text>
<rect x="272" y="200" width="200" height="56" rx="6" fill="#f3f2f0"/>
<rect x="272" y="200" width="200" height="56" rx="6" fill="#ffffff" stroke="#252f3d" stroke-width="1"/>
