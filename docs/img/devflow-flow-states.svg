  <title id="flow-states-title">步骤终态及其转移</title>
  <desc id="flow-states-desc">四态：Pending 在拿到签名裁决后转为 Locked 或 Failed；trivial/session 档直接跳过门禁进入 Done。Done 与 Locked 是不同的终态。</desc>
