verify = "`uv run harness serve --demo` exits 0; the 4 views render; `uv run pytest` exits 0; no behavior change to stories 1–9 + 11's verify lines."
covers = ["FR-24", "FR-25", "FR-26", "FR-27", "AD-21"]
after = [9, 11]
hitl = false
risk = "low"
notes = [
