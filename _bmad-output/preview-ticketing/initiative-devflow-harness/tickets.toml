# tickets.toml — DevFlow Harness initiative's agreed children.
# Build order = order of tables. Each epic carries an `id` and `slug`; entries in other epics refer to its stories as `<epic id>.<entry id>`.
# After publication this file is read by tickets.py and any change goes through `tickets.py` or a tracker verb — not by hand.

[[epic]]
id = 1
slug = "epic-platform-baseline"
title = "Platform baseline — harness scaffold, signing key, canonical bytes, CI lint"
covers = []   # platform baseline carries no parent requirement ids; entries cite spine ADs as covers (e.g. AD-17)

[[epic]]
id = 2
slug = "epic-pipeline-and-gates"
title = "Pipeline software-v1 + six steps + Gates + Acknowledgement"
covers = ["CAP-1", "CAP-2", "CAP-3"]
after = [{ epic = 1, needs = "harness scaffold, signing key, canonical bytes, layer-boundary lint, human ExecutorAdapter" }]

[[epic]]
id = 3
slug = "epic-error-benchmark-skill"
title = "Error store + retry ladder + benchmark + Skill Bump Registry"
covers = ["CAP-4", "CAP-5", "CAP-6"]
after = [{ epic = 2, needs = "Quality Gate Engine + Acknowledgement writer + step_status resolver" }]

[[epic]]
id = 4
slug = "epic-dashboard-cost"
title = "Operator dashboard + cost guard + Herdr event ingest"
covers = ["CAP-7", "CAP-8"]
after = [
  { epic = 2, needs = "Acknowledgement writer + step_status resolver + ExecutorAdapter port" },
  { epic = 3, needs = "Run Event Log + error store + regression set + benchmark query + skill bump registry writers" }
]
